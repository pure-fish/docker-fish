name: Build and push Docker images
on:
  push:
    paths:
      - ".github/workflows/**"
    branches:
      - "main"
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images'
        required: false
        default: false
        type: boolean
      fish_version:
        description: 'Rebuild only this Fish version (leave empty to build all)'
        required: false
        default: ''
        type: string

jobs:
  build-image:
    name: Build and push # fish image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [
            # fish version, alpine version, and whether to build using binary
            # { fish: 3.0.2, alpine: 3.11 }, # no support for `just`
            # New versions built with pre-built binary 
            { fish: 3.1.2, alpine: 3.13 },
            { fish: 3.2.2, alpine: 3.14 },
            { fish: 3.3.1, alpine: 3.15 },
            { fish: 3.4.1, alpine: 3.16 },
            { fish: 3.5.1, alpine: 3.17 },
            { fish: 3.6.1, alpine: 3.18 },
            { fish: 3.6.3, alpine: 3.19 },
            { fish: 3.7.1, alpine: 3.21 },
            { fish: 4.0.2, alpine: 3.22 },
            { fish: 4.1.2, alpine: "edge", binary: true },
            { fish: 4.2.1, alpine: "edge", binary: true },
            { fish: 4.4.0, alpine: "edge", binary: true },
            { fish: 4.5.0, alpine: "edge", binary: true },
            { fish: 4.6.0, alpine: 3.24, binary: true },
            { fish: 4.7.0, alpine: "edge", binary: true },
            { fish: 4.7.1, alpine: "edge", binary: true },
            { fish: 4.8.1, alpine: "edge", binary: true },
            { fish: 4.9.0, alpine: "edge", binary: true },
            { fish: 4.9.1, alpine: "edge", binary: true },
            { fish: 4.9.2, alpine: "edge", binary: true },
            { fish: 4.9.3, alpine: "edge", binary: true },
          ]
      fail-fast: false
    steps:
      - name: Check if matrix contains fish_version to rebuild
        id: version-filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ -n "${{ inputs.fish_version }}" ] && \
             [ "${{ inputs.fish_version }}" != "${{ matrix.version.fish }}" ]; then
            echo "MATCH=false" >> "$GITHUB_OUTPUT"
          else
            echo "MATCH=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.version-filter.outputs.MATCH == 'true'
        uses: actions/checkout@v4

      - name: Detect latest item from matrix
        if: steps.version-filter.outputs.MATCH == 'true'
        id: detect-latest-tag
        run: echo "IS_LATEST=$([ $(expr ${{ strategy.job-index }} + 1) = ${{ strategy.job-total }} ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        if: steps.version-filter.outputs.MATCH == 'true'
        id: meta
        uses: docker/metadata-action@v5.5.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            purefish/docker-fish
          # ghcr.io/pure-fish/docker-fish # need token
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}},value=${{matrix.version.fish}}
            type=raw,value=latest,enable=${{ steps.detect-latest-tag.outputs.IS_LATEST }}
          flavor: |
            latest=false

      - name: Set up QEMU
        if: steps.version-filter.outputs.MATCH == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version-filter.outputs.MATCH == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.version-filter.outputs.MATCH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Check if image exists on Docker Hub
        if: steps.version-filter.outputs.MATCH == 'true'
        id: check-image
        run: |
          IMAGE_NAME="purefish/docker-fish:${{ matrix.version.fish }}"
          FORCE_REBUILD=${{ inputs.force_rebuild || steps.version-filter.outputs.MATCH == 'true' || false }}

          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "🧹 Force rebuild enabled, proceeding with build"
            echo "SKIP_BUILD=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect $IMAGE_NAME >/dev/null 2>&1; then
            echo "🛑 Image already exists, skipping build"
            echo "SKIP_BUILD=true" >> "$GITHUB_OUTPUT"
          else
            echo "🆕 Image does not exist, proceeding with build"
            echo "SKIP_BUILD=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build fish:${{ matrix.version.fish }} image
        if: steps.version-filter.outputs.MATCH == 'true' && steps.check-image.outputs.SKIP_BUILD == 'false'
        uses: docker/build-push-action@v5
        with:
          push: true
          context: .
          file: ./Dockerfile
          build-contexts: |
            alpine=docker-image://alpine:${{ matrix.version.alpine }}
          build-args: |
            FISH_VERSION=${{ matrix.version.fish }}
            BUILD_USING_BINARY=${{ matrix.version.binary == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Test installed version match expected ${{ matrix.version.fish }}
        if: steps.version-filter.outputs.MATCH == 'true'
        run: |
          docker run \
            --rm \
            purefish/docker-fish:${{ matrix.version.fish }} \
              'fish --version | grep ${{ matrix.version.fish }}'
