name: Build and push Docker images
on:
  push:
    paths:
      - ".github/workflows/**"
    branches:
      - "main"
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild all images"
        required: false
        default: false
        type: boolean
      fish_version:
        description: "Rebuild only this Fish version (leave empty to build all)"
        required: false
        default: ""
        type: string

jobs:
  build-image:
    permissions:
      contents: read
      id-token: write # OIDC token for keyless signing

    name: Build and push # fish image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [
            # fish version, alpine version, and whether to build using binary
            # New versions built with pre-built binary
            # { fish: 3.6.0, alpine: 3.18,    binary: true   }, # for Debian 12 but no binary before 4.x
            { fish: 3.6.1, alpine: 3.18, binary: false }, # fallback for Debian 12
            { fish: 3.6.3, alpine: 3.19, binary: false },
            # { fish: 3.7.0, alpine: 3.21,    binary: true  }, # for Ubuntu 24.04 LTS but no binary before 4.x
            { fish: 3.7.1, alpine: 3.21, binary: false }, # for Entreprise Linux 10, fallback for Ubuntu 24.04 LTS
            { fish: 4.0.2, alpine: 3.22, binary: false }, # for Debian 13, Fedora 43
            { fish: 4.1.2, alpine: "edge", binary: true },
            { fish: 4.2.0, alpine: 3.24, binary: true }, # for Entreprise Linux 10
            { fish: 4.2.1, alpine: "edge", binary: true }, # for Ubuntu 26.04 LTS
            { fish: 4.4.0, alpine: "edge", binary: true },
            { fish: 4.5.0, alpine: "edge", binary: true },
            { fish: 4.6.0, alpine: 3.24, binary: true }, # for Fedora 44
            { fish: 4.7.0, alpine: "edge", binary: true },
            { fish: 4.7.1, alpine: "edge", binary: true },
            { fish: 4.8.0, alpine: "edge", binary: true },
            { fish: 4.8.1, alpine: "edge", binary: true },
            { fish: 4.9.0, alpine: "edge", binary: true },
            { fish: 4.9.1, alpine: "edge", binary: true },
            { fish: 4.9.2, alpine: "edge", binary: true },
            { fish: 4.9.3, alpine: "edge", binary: true },
          ]
      fail-fast: false
    steps:
      - name: Check if matrix contains fish_version to rebuild
        id: version-filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
          && [ -n "${{ inputs.fish_version }}" ] \
          && [ "${{ inputs.fish_version }}" != "${{ matrix.version.fish }}" ]; \
          then
            echo "Invalid fish version: ${{ inputs.fish_version }}"
            exit 1 # cancel the workflow if the fish version is invalid
          else
            echo "MATCH=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect latest item from matrix
        id: detect-latest-tag
        run: echo "IS_LATEST=$([ $(expr ${{ strategy.job-index }} + 1) = ${{ strategy.job-total }} ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            purefish/docker-fish
          # ghcr.io/pure-fish/docker-fish # need token
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}},value=${{matrix.version.fish}}
            type=raw,value=latest,enable=${{ steps.detect-latest-tag.outputs.IS_LATEST }}
          flavor: |
            latest=false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

        # Must happen before we build 
      - name: Check if we need to build and publish the image
        id: image-exist
        run: |
          IMAGE_NAME="purefish/docker-fish:${{ matrix.version.fish }}"
          BUILD=true

          # Abort if the image already exists on Docker Hub
          if docker manifest inspect $IMAGE_NAME >/dev/null 2>&1; then
            echo "🛑 Image already exists, skipping build"
            BUILD=false
          fi

          FORCE_REBUILD=${{ inputs.force_rebuild || false }}
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "🧹 Force rebuild enabled, proceeding with build"
          else
            echo "🆕 Image does not exist, proceeding with build"
          fi

          echo "BUILD=$BUILD" >> "$GITHUB_OUTPUT"
          echo "PUBLISH=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"


      - name: Build fish:${{ matrix.version.fish }} and export to internal cache
        if: steps.image-exist.outputs.BUILD == 'true'
        uses: docker/build-push-action@v7
        with:
          # to test with local images during PRs
          load: true
          push: false
          platforms: linux/amd64
          # No attestations for the local test image: they turn the result into
          # a manifest list, which the docker exporter (`load: true`) cannot load.
          sbom: false
          provenance: false
          # end local image testing for PRs
          context: .
          file: ./Dockerfile
          build-contexts: |
            alpine=docker-image://alpine:${{ matrix.version.alpine }}
          build-args: |
            FISH_VERSION=${{ matrix.version.fish }}
            BUILD_USING_BINARY=${{ matrix.version.binary == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # enable SBOM and provenance for all builds

      - name: Test installed version match expected ${{ matrix.version.fish }}
        if: steps.image-exist.outputs.BUILD == 'true'
        run: |
          docker run \
            --rm \
            purefish/docker-fish:${{ matrix.version.fish }} \
              'fish --version | grep ${{ matrix.version.fish }}'

      - name: Build fish:${{ matrix.version.fish }} image
        id: build
        if: steps.image-exist.outputs.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          platforms: 'linux/amd64,linux/arm64,linux/arm/v7'
          push: true
          context: .
          file: ./Dockerfile
          build-contexts: |
            alpine=docker-image://alpine:${{ matrix.version.alpine }}
          build-args: |
            FISH_VERSION=${{ matrix.version.fish }}
            BUILD_USING_BINARY=${{ matrix.version.binary == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # enable SBOM and provenance for all builds
          sbom: true # add inventory of components used to build image https://docs.docker.com/build/ci/github-actions/attestations/
          provenance: mode=max # as we are OSS

      - name: Install cosign
        # Skip PRs from forks as they get no id-token for keyless signing
        if: steps.image-exist.outputs.PUBLISH == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless) # https://dev.to/n3wt0n/sign-your-container-images-with-cosign-github-actions-and-github-container-registry-3mni
        if: steps.image-exist.outputs.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag%%:*}@${DIGEST}"
          done
